name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  models: read   # lets later days call GitHub Models with the built-in token

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check .
      # Day 4 adds prompt tests here:
      # - run: pytest -q
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
